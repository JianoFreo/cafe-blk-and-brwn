<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0806" />
    <title></title>
    <script>
      // Same head script as the original site: marks JS as available, plays the intro only on the
      // first visit of a session, and falls back to a plain page if the animations never start.
      document.documentElement.classList.add("js");
      try {
        if (location.pathname === "/" && !sessionStorage.getItem("bb-pre")) document.documentElement.classList.add("is-loading");
      } catch (e) {
        if (location.pathname === "/") document.documentElement.classList.add("is-loading");
      }
      setTimeout(function () {
        if (!document.documentElement.classList.contains("motion-ready")) {
          document.documentElement.classList.add("no-motion");
          document.documentElement.classList.remove("is-loading");
        }
      }, 6000);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
